name: ProjectSalah
options:
  bundleIdPrefix: com.sif
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  ProjectSalah:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ProjectSalah
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/ProjectSalah.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sif.projectsalah]
        application-identifier: ABCDE12345.com.sif.projectsalah
        com.apple.developer.team-identifier: ABCDE12345
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sif.projectsalah