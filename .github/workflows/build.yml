name: Build TrollStore IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without signing
        run: |
          xcodebuild build \
            -project ProjectSalah.xcodeproj \
            -scheme ProjectSalah \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Add entitlements with ldid
        run: |
          APP=build/Build/Products/Release-iphoneos/ProjectSalah.app
          ldid -SMonitor/ProjectSalahMonitor.entitlements \
            "$APP/PlugIns/ProjectSalahMonitor.appex/ProjectSalahMonitor"
          ldid -SApp/ProjectSalah.entitlements "$APP/ProjectSalah"

      - name: Show entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/ProjectSalah.app
          echo "--- Extension ---"
          ldid -e "$APP/PlugIns/ProjectSalahMonitor.appex/ProjectSalahMonitor"
          echo "--- App ---"
          ldid -e "$APP/ProjectSalah"

      - name: Package as .tipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ProjectSalah.app Payload/
          zip -qr ProjectSalah.tipa Payload

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ProjectSalah.tipa